services:
  wedding-website:
    build: .
    container_name: wedding-website
    restart: unless-stopped
    ports:
      - "3099:3000"
    volumes:
      - wedding-data:/data
    environment:
      - DB_PATH=/data/wedding.db
      - UPLOADS_DIR=/data/uploads
    networks:
      - n8n-network

volumes:
  wedding-data:

networks:
  n8n-network:
    external: true