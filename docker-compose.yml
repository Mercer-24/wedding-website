services:
  wedding-website:
    build: .
    container_name: wedding-website
    restart: unless-stopped
    volumes:
      - wedding-data:/data
    environment:
      - DB_PATH=/data/wedding.db
      - UPLOADS_DIR=/data/uploads
      - ADMIN_PASSWORD=hochzeit2025
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.wedding.rule=Host(`feliciapaul.mercerdev.me`)"
      - "traefik.http.routers.wedding.entrypoints=web,websecure"
      - "traefik.http.routers.wedding.tls.certresolver=mytlschallenge"
      - "traefik.http.services.wedding.loadbalancer.server.port=3000"
    networks:
      - proxy

volumes:
  wedding-data:

networks:
  proxy:
    external: true
    name: proxy
